name: BENM Android Play device check
on:
  push:
    branches: [codex/benm-android-play]
    paths: ['android-play-source.zip', '.github/workflows/benm-android-play.yml']
permissions:
  contents: read
concurrency:
  group: benm-android-play
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack source without signing keys
        run: |
          unzip -q android-play-source.zip -d android
          chmod +x android/gradlew
          test ! -f android/upload-signing.properties
      - name: Build and test debug
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android 16 screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant cl.radioequipo.app android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w cl.radioequipo.app/cl.radioequipo.app.StoreCaptureInstrumentation | tee device-check.txt
            grep 'capturados correctamente' device-check.txt
            mkdir -p screenshots
            adb exec-out run-as cl.radioequipo.app cat files/store-captures/01-acceso.png > screenshots/01-acceso.png
            adb exec-out run-as cl.radioequipo.app cat files/store-captures/02-lista.png > screenshots/02-lista.png
            adb exec-out run-as cl.radioequipo.app cat files/store-captures/03-privacidad.png > screenshots/03-privacidad.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BENM-Play-capturas-y-pruebas
          path: |
            screenshots/
            device-check.txt
            android/app/build/test-results/
